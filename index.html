<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperlink Generator</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #202124; 
            color: #fff; 
            padding: 30px; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #2f3136;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
        }
        h3 { margin-top: 0; color: #7289da; font-size: 20px; text-align: center; }
        input { 
            width: calc(100% - 24px); 
            background: #36393f; 
            border: 1px solid #202124; 
            color: #fff; 
            padding: 10px 12px; 
            border-radius: 6px; 
            font-size: 15px; 
            outline: none; 
            margin-bottom: 20px;
            margin-top: 5px;
        }
        input:focus { border-color: #7289da; }
        #output-container { 
            background: #202124; 
            padding: 15px; 
            border-radius: 6px; 
            min-height: 40px; 
            word-break: break-all;
            text-align: center;
        }
        a { color: #00b0f4; text-decoration: none; font-weight: bold; font-size: 16px; }
        a:hover { text-decoration: underline; }
        p { margin: 0; font-size: 14px; color: #b9bbbe; }
    </style>
</head>
<body>

    <div class="container">
        <h3>🔗 Hyperlink Generator</h3>
        <p>Type a URL and press Enter:</p>
        <input type="text" id="url-input" placeholder="e.g., wikipedia.org" onkeydown="generateLink(event)">

        <p style="margin-bottom: 5px;">Generated Result:</p>
        <div id="output-container">
            <span id="placeholder-text" style="color: #72767d; font-style: italic; font-size: 14px;">Your link will appear here...</span>
        </div>
    </div>

    <script>
        function generateLink(e) {
            if (e.key === 'Enter') {
                let rawUrl = document.getElementById('url-input').value.trim();
                if (!rawUrl) return;

                let formattedUrl = rawUrl;
                if (!rawUrl.startsWith('http://') && !rawUrl.startsWith('https://')) {
                    formattedUrl = 'https://' + rawUrl;
                }

                // Generates a link forcing target="_self" so it tries to stay in app
                document.getElementById('output-container').innerHTML = `<a href="${formattedUrl}" target="_self">${formattedUrl}</a>`;
            }
        }

        // 🛡️ THE BULLETPROOF IN-APP LOCK:
        // This watches the entire page. Even if a loaded website forces a new window 
        // or uses target="_blank", it catches it and locks it inside your Python app.
        
        // 1. Intercept mouse clicks on links
        document.addEventListener('click', function(e) {
            let target = e.target.closest('a');
            if (target) {
                // If it tries to open in a new window, disable it and load it here instead
                if (target.target === '_blank' || target.getAttribute('target') === '_blank') {
                    e.preventDefault();
                    window.location.href = target.href;
                }
            }
        }, true);

        // 2. Intercept JavaScript code redirects (like window.open)
        window.open = function(url) {
            if (url) {
                window.location.href = url;
            }
            return null;
        };

        // 3. Keep rewriting targets if nested tracking frames load dynamic links
        const observer = new MutationObserver(() => {
            document.querySelectorAll('a[target="_blank"]').forEach(link => {
                link.setAttribute('target', '_self');
            });
        });
        observer.observe(document.body, { childList: true, subtree: true });
    </script>
</body>
</html>
